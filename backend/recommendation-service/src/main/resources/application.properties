spring.application.name=recommendation-service
server.port=8082

# Endereços dos outros serviços (no Docker Compose vêm por variável de ambiente)
catalog.url=${CATALOG_URL:http://localhost:8081}
llm.url=${LLM_URL:http://localhost:8083}

# Erros no formato Problem (application/problem+json), como pede o contrato
spring.mvc.problemdetails.enabled=true
# Campos null não vão no JSON (ex.: reason quando a IA não foi usada)
spring.jackson.default-property-inclusion=non_null

# requestId em toda linha de log
logging.pattern.correlation=[%X{requestId:-}] 
