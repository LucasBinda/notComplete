spring.application.name=catalog-service
server.port=8081

# Lê backend/.env (fora do Git) como configuração; no Docker a chave vem por variável de ambiente
spring.config.import=optional:file:../.env[.properties]
# Vazio quando não há chave, para os testes subirem sem ela
tmdb.api-key=${TMDB_API_KEY:}

# Erros no formato Problem (application/problem+json), como pede o contrato
spring.mvc.problemdetails.enabled=true

# Plataformas oferecidas no site, em ordem de relevância (ids do TMDB):
# Netflix, Prime Video, Disney+, HBO Max, Globoplay, Apple TV, Paramount+
catalog.providers=${CATALOG_PROVIDERS:8,119,337,1899,307,350,531}
