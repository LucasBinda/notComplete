spring.application.name=llm-service
server.port=8083

# Lê backend/.env (fora do Git) como configuração; no Docker a chave vem por variável de ambiente
spring.config.import=optional:file:../.env[.properties]
# Vazio quando não há chave, para os testes subirem sem ela
groq.api-key=${GROQ_API_KEY:}
groq.url=${GROQ_URL:https://api.groq.com/openai/v1}

# Modelos (docs/APIS.md): os dois gpt-oss aceitam o modo estrito de JSON
llm.intent-model=${LLM_INTENT_MODEL:openai/gpt-oss-20b}
llm.rerank-model=${LLM_RERANK_MODEL:openai/gpt-oss-120b}

# Erros no formato Problem (application/problem+json), como pede o contrato
spring.mvc.problemdetails.enabled=true
# Critério null não vai no JSON (null = sem restrição)
spring.jackson.default-property-inclusion=non_null
